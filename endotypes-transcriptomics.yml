# Environment for endotypes-transcriptomics.
#
#   mamba env create -f endotypes-transcriptomics.yml    (or conda / micromamba)
#   mamba activate endotypes-transcriptomics
#   Rscript -e 'IRkernel::installspec()'                  # register the R kernel
#   python -m bash_kernel.install                         # register the Bash kernel
#   jupyter lab
#
# The same file builds the environment on a laptop (osx-arm64, osx-64) and on the
# Lifebit JupyterLab image (linux-64).
#
# All analysis is R. JupyterLab, nbconvert and bash_kernel are Python packages,
# so conda pulls a Python interpreter in as their dependency. Python is the
# notebook host, not a language this project writes code in.
name: endotypes-transcriptomics
channels:
  - conda-forge
  - bioconda
dependencies:
  # ── notebook host and kernels ───────────────────────────────────────────
  - jupyterlab
  - nbconvert                  # used by run_all.sh to execute the notebooks
  - jupyter_core               # provides the `jupyter` command
  - r-irkernel                 # R kernel
  - bash_kernel                # Bash kernel

  # ── R ───────────────────────────────────────────────────────────────────
  - r-base=4.4.*

  # download from GEO (Gene Expression Omnibus)
  - bioconductor-geoquery
  - r-data.table
  - r-curl

  - bioconductor-limma                    # neqc normalization of the Illumina arrays; limma-voom
  - bioconductor-illuminahumanv4.db       # probe quality of the Illumina HumanHT-12 v4 array

  # differential expression
  - bioconductor-edger
  - bioconductor-deseq2

  # batch correction of RNA sequencing counts (ComBat-seq), internal CANDLE / SAVI data (notebook 40)
  - bioconductor-sva

  # remove unwanted variation with control genes (RUVg), healthy-control lab correction (notebook 49)
  - bioconductor-ruvseq

  # WGCNA dependencies. WGCNA itself has no osx-arm64 conda build, so the
  # WGCNA notebooks install it from CRAN in a visible first cell.
  - r-dynamictreecut
  - r-fastcluster
  - bioconductor-impute
  - bioconductor-preprocesscore
  - r-hmisc
  - r-matrixstats
  - r-foreach
  - r-doparallel
  - bioconductor-go.db
  - bioconductor-annotationdbi
  # WGCNA from CRAN contains C code; conda's R calls conda's compilers by name
  - compilers

  # GSE135779 supplementary table (xlsx)
  - r-readxl

  # federation: random-effects meta-analysis
  - r-metafor

  # mixed models for repeated visits
  - r-nlme

  # clustering and figures
  - r-cluster
  - bioconductor-complexheatmap
  - r-circlize
  - r-jsonlite

  # single-cell count matrices (Matrix Market files) for pseudobulk
  - r-matrix

  # ── Python notebooks: pvclust-py (AU p-values by multiscale bootstrap) ──
  # pinned to a GitHub commit so every build gets the same code
  - python>=3.11
  - pip
  - pip:
      - "pvclust-py @ git+https://github.com/NIH-NLM/pvclust-py.git@6b0c3bf8aea04f67e8e1ce4ac7bf2e46d0d13224"
